version: "3.8"
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=xyz
      - SERVER_COUNTRIES=abc
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24
    ports:
      - 8888:8888 # qBittorrent WebUI
      - 6888:6888 # qBittorrent torrent port
      - 6888:6888/udp
      - 7878:7878 # Radarr
      - 8989:8989 # Sonarr
      - 6767:6767 # Bazarr
      - 9696:9696 # Prowlarr
      - 8191:8191 # FlareSolverr
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "1.1.1.1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "container:gluetun"
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Indianapolis
      - WEBUI_PORT=8888
    volumes:
      - /volume1/Config/Gluetun/qbittorrent:/config
      - /volume1/Downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Indianapolis
    volumes:
      - /volume1/Config/Radarr:/config
      - /volume1/Downloads:/downloads
      - /volume1/Media:/media
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Indianapolis
    volumes:
      - /volume1/Config/Sonarr:/config
      - /volume1/Downloads:/downloads
      - /volume1/Media:/media
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Indianapolis
    volumes:
      - /volume1/Config/Bazarr:/config
      - /volume1/Media:/media
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Indianapolis
    volumes:
      - /volume1/Config/Prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Indianapolis
    volumes:
      - /volume1/Config/Jellyfin:/config
      - /volume1/Config/Jellyfin/cache:/cache
      - /volume1/Media:/data
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8899:8096
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    environment:
      - TZ=America/Indianapolis
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - TZ=America/Indianapolis
      - LOG_LEVEL=info
    volumes:
      - /volume1/Config/Jellyseerr:/app/config
    ports:
      - 5055:5055
    depends_on:
      - gluetun
      - radarr
      - sonarr
      - jellyfin
    restart: unless-stopped
