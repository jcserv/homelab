# Namespace to deploy to
namespace: default

# Schedule for backup (cron format)
schedule: "0 3 * * *"  # Daily at 3:00 AM

# PostgreSQL connection details
postgres:
  host: "immich-postgres.default.svc.cluster.local"
  port: 5432
  database: "immich"
  user: "postgres"
  secretName: "immich-secrets"
  secretKey: "DB_PASSWORD"

# Backup configuration
backup:
  # B2 bucket settings
  bucket: "homelab-backups-431118"
  path: "immich"
  endpoint: "s3.ca-east-006.backblazeb2.com"
  # Number of backups to keep
  retention: 7
  # Compression level (1-9, higher = better compression, slower)
  compressionLevel: 6

# B2 credentials secret
b2Secret:
  name: "app-backups-b2-secrets"

# Image settings
postgres_image:
  repository: "postgres"
  tag: "18-alpine"
  pullPolicy: IfNotPresent

rclone_image:
  repository: "rclone/rclone"
  tag: "1.74"
  pullPolicy: IfNotPresent

# Job settings
jobSettings:
  backoffLimit: 2
  restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Job timeout (seconds)
  activeDeadlineSeconds: 3600

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 30s
  prometheusRule:
    enabled: true
    # Alert if backup hasn't succeeded in 25 hours
    backupMissingHours: 25
    # Alert if backup takes longer than 30 minutes
    backupDurationMinutes: 30

# Infisical Secrets Operator integration.
# When enabled, the operator syncs secrets from the self-hosted Infisical
# platform into the managed K8s Secret(s), replacing the SealedSecret(s) in
# sealed-secrets/. Requires charts/infisical-secrets-operator + machine identity.
# Kept disabled until per-chart cutover (Phase 3). See
# docs/runbooks/INFISICAL_MIGRATION.md.
infisical:
  enabled: true
  # In-cluster Service URL — public hostname only resolves via pihole DNS,
  # which CoreDNS can't reach. Keeps operator traffic in-cluster.
  hostAPI: http://infisical-infisical-standalone-infisical.default.svc.cluster.local:8080/api
  resyncInterval: 60s
  instantUpdates: false
  projectSlug: homelab-nkcl
  envSlug: prod
  secretsPath: /backup/immich
  credentialsRef:
    secretName: infisical-machine-identity
    secretNamespace: infisical-secrets-operator
