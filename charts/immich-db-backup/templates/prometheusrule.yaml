{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "immich-db-backup.fullname" . }}
  labels:
    {{- include "immich-db-backup.labels" . | nindent 4 }}
    release: monitoring-stack
spec:
  groups:
  - name: immich-db-backup.rules
    interval: 60s
    rules:
    # Alert if the backup job has failed
    - alert: ImmichBackupJobFailed
      expr: |
        kube_job_status_failed{job_name=~"{{ include "immich-db-backup.fullname" . }}-.*"} > 0
      for: 5m
      labels:
        severity: critical
        component: backup
        service: immich
      annotations:
        summary: "Immich database backup job failed"
        description: "The Immich database backup job {{ "{{" }} $labels.job_name {{ "}}" }} has failed. Check the job logs for details."

    # Alert if no successful backup in the last 25 hours
    - alert: ImmichBackupJobMissing
      expr: |
        (time() - kube_job_status_completion_time{job_name=~"{{ include "immich-db-backup.fullname" . }}-.*"} > {{ .Values.monitoring.prometheusRule.backupMissingHours }} * 3600)
        or
        (absent(kube_job_status_completion_time{job_name=~"{{ include "immich-db-backup.fullname" . }}-.*"}))
      for: 10m
      labels:
        severity: warning
        component: backup
        service: immich
      annotations:
        summary: "Immich database backup has not run recently"
        description: "No successful Immich database backup in the last {{ .Values.monitoring.prometheusRule.backupMissingHours }} hours."

    # Alert if the backup job is taking too long
    - alert: ImmichBackupJobDurationHigh
      expr: |
        (time() - kube_job_status_start_time{job_name=~"{{ include "immich-db-backup.fullname" . }}-.*"})
        and
        (kube_job_status_active{job_name=~"{{ include "immich-db-backup.fullname" . }}-.*"} > 0)
        > {{ .Values.monitoring.prometheusRule.backupDurationMinutes }} * 60
      for: 5m
      labels:
        severity: warning
        component: backup
        service: immich
      annotations:
        summary: "Immich database backup job is taking too long"
        description: "The Immich database backup job has been running for more than {{ .Values.monitoring.prometheusRule.backupDurationMinutes }} minutes."
{{- end }}
