{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "home-assistant-backup.fullname" . }}
  labels:
    {{- include "home-assistant-backup.labels" . | nindent 4 }}
    release: monitoring-stack
spec:
  groups:
  - name: home-assistant-backup.rules
    interval: 60s
    rules:
    # Alert if the backup job has failed
    - alert: HomeAssistantBackupJobFailed
      expr: |
        kube_job_status_failed{job_name=~"{{ include "home-assistant-backup.fullname" . }}-.*"} > 0
      for: 5m
      labels:
        severity: critical
        component: backup
        service: homeassistant
      annotations:
        summary: "Home Assistant backup job failed"
        description: "The Home Assistant backup job {{ "{{" }} $labels.job_name {{ "}}" }} has failed. Check the job logs for details."

    # Alert if no successful backup in the last 25 hours
    - alert: HomeAssistantBackupJobMissing
      expr: |
        (time() - kube_job_status_completion_time{job_name=~"{{ include "home-assistant-backup.fullname" . }}-.*"} > {{ .Values.monitoring.prometheusRule.backupMissingHours }} * 3600)
        or
        (absent(kube_job_status_completion_time{job_name=~"{{ include "home-assistant-backup.fullname" . }}-.*"}))
      for: 10m
      labels:
        severity: warning
        component: backup
        service: homeassistant
      annotations:
        summary: "Home Assistant backup has not run recently"
        description: "No successful Home Assistant backup in the last {{ .Values.monitoring.prometheusRule.backupMissingHours }} hours."

    # Alert if the backup job is taking too long
    - alert: HomeAssistantBackupJobDurationHigh
      expr: |
        (time() - kube_job_status_start_time{job_name=~"{{ include "home-assistant-backup.fullname" . }}-.*"})
        and
        (kube_job_status_active{job_name=~"{{ include "home-assistant-backup.fullname" . }}-.*"} > 0)
        > {{ .Values.monitoring.prometheusRule.backupDurationMinutes }} * 60
      for: 5m
      labels:
        severity: warning
        component: backup
        service: homeassistant
      annotations:
        summary: "Home Assistant backup job is taking too long"
        description: "The Home Assistant backup job has been running for more than {{ .Values.monitoring.prometheusRule.backupDurationMinutes }} minutes."
{{- end }}
