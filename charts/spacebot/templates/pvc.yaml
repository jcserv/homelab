apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "spacebot.fullname" . }}-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spacebot.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
