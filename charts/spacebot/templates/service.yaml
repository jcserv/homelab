apiVersion: v1
kind: Service
metadata:
  name: {{ include "spacebot.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "spacebot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.webPort }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "spacebot.selectorLabels" . | nindent 4 }}
