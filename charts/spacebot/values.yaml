---
namespace: default
replicaCount: 1
image:
  repository: ghcr.io/spacedriveapp/spacebot
  tag: "latest"
  pullPolicy: IfNotPresent
# Resource limits — Pi5 nodes have ~7.5GB allocatable
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: 2000m
    memory: 2Gi
# Prefer Pi5 nodes (8GB RAM) over Pi4 (4GB)
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi5-01
                - pi5-02
# Single /data volume for SQLite, LanceDB, redb, Chrome cache, embeddings
storage:
  data:
    storageClass: local-path
    size: 10Gi
service:
  type: ClusterIP
  webPort: 19898
  metricsPort: 9090
ingress:
  enabled: true
  className: nginx
  host: spacebot.jarrodservilla.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Authentik forward-auth
    nginx.ingress.kubernetes.io/auth-url: http://authentik-outpost.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.jarrodservilla.com/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups
    nginx.ingress.kubernetes.io/auth-snippet: proxy_set_header X-Forwarded-Host $http_host;
    # WebSocket support for live agent output
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
  tls:
    enabled: true
    secretName: wildcard-jarrodservilla-tls
# Sealed secret containing API keys
secrets:
  secretName: spacebot-secrets
  # Expected keys:
  #   ANTHROPIC_API_KEY
  #   OPENROUTER_API_KEY
  #   DISCORD_TOKEN
# Spacebot config.toml — mounted via ConfigMap
config:
  # LLM routing: Anthropic direct for complex, OpenRouter for cheap routing
  llm:
    anthropicKey: env:ANTHROPIC_API_KEY
    openrouterKey: env:OPENROUTER_API_KEY
  defaults:
    rateLimitCooldownSecs: 300
    workerTimeoutSecs: 300
    branchTimeoutSecs: 600
    routing:
      channel: anthropic/claude-sonnet-4
      worker: anthropic/claude-haiku-4.5
      promptRouting:
        enabled: true
        processTypes: [channel, branch]
      taskOverrides:
        coding: anthropic/claude-sonnet-4
        summarization: openrouter/meta-llama/llama-3.1-8b-instruct
      fallbacks:
        anthropic/claude-sonnet-4: [openrouter/anthropic/claude-sonnet-4]
        anthropic/claude-haiku-4.5: [openrouter/anthropic/claude-haiku-4.5]
  messaging:
    discord:
      enabled: true
      token: env:DISCORD_TOKEN

  # Browser tool — enabled with egress network restrictions
  browser:
    enabled: true

  # Shell tool — sandboxed via bubblewrap
  shell:
    enabled: true
    sandboxed: true
# Network policy — egress + ingress
networkPolicy:
  enabled: true
  egress:
    # Allow HTTPS to public internet, block all private IP ranges
    allowPublicHTTPS: true
    # Allow DNS resolution
    allowDNS: true
  ingress:
    # Web UI from nginx-ingress only
    allowNginxIngress: true
    # Prometheus metrics scraping
    allowMonitoring: true
  cidrs:
    podNetwork: 10.42.0.0/16
    serviceNetwork: 10.43.0.0/16
# Prometheus monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
