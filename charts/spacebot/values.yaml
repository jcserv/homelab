---
namespace: default
replicaCount: 1
image:
  repository: ghcr.io/spacedriveapp/spacebot
  tag: "latest"
  pullPolicy: IfNotPresent
# Resource limits — Pi5 nodes have ~7.5GB allocatable
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: 2000m
    memory: 2Gi
# Prefer Pi5 nodes (8GB RAM) over Pi4 (4GB)
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi5-01
                - pi5-02
# Single /data volume for SQLite, LanceDB, redb, Chrome cache, embeddings
storage:
  data:
    storageClass: local-path
    size: 10Gi
service:
  type: ClusterIP
  webPort: 19898
  metricsPort: 9090
ingress:
  enabled: true
  className: nginx
  host: ai.jarrodservilla.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Authentik forward-auth
    nginx.ingress.kubernetes.io/auth-url: http://authentik-server.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-proxy-set-headers: default/spacebot-auth-headers
    nginx.ingress.kubernetes.io/auth-signin: https://ai.jarrodservilla.com/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    # WebSocket support for live agent output
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
  tls:
    enabled: true
    secretName: wildcard-jarrodservilla-tls
# Sealed secret containing API keys
secrets:
  secretName: spacebot-secrets
  # Expected keys:
  #   OPENROUTER_API_KEY  (with Anthropic BYOK configured in OpenRouter dashboard)
  #   DISCORD_TOKEN
# Spacebot config.toml — mounted via ConfigMap
config:
  # All models routed through OpenRouter with Anthropic BYOK
  # Configure your Anthropic API key in OpenRouter dashboard under Keys > BYOK
  # First 1M BYOK requests/month are free, then 5% fee
  llm:
    openrouterKey: env:OPENROUTER_API_KEY
  defaults:
    rateLimitCooldownSecs: 300
    workerTimeoutSecs: 300
    branchTimeoutSecs: 600
    routing:
      # OpenRouter routes to Anthropic via BYOK at direct pricing
      channel: openrouter/anthropic/claude-sonnet-4
      branch: openrouter/anthropic/claude-sonnet-4
      worker: openrouter/anthropic/claude-haiku-4.5
      promptRouting:
        enabled: true
        processTypes: [channel, branch]
      taskOverrides:
        coding: openrouter/anthropic/claude-sonnet-4
        summarization: openrouter/meta-llama/llama-3.1-8b-instruct
      fallbacks:
        openrouter/anthropic/claude-sonnet-4: [openrouter/anthropic/claude-haiku-4.5]
        openrouter/anthropic/claude-haiku-4.5: [openrouter/meta-llama/llama-3.1-8b-instruct]
  messaging:
    discord:
      enabled: true
      token: env:DISCORD_TOKEN

  # Agent permissions — network and exec controls
  permissions:
    networkOutbound: true
    # Allow private IPs for cluster-internal services (Immich, Home Assistant)
    # NetworkPolicy provides the actual security boundary
    networkAllowPrivate:
      - "10.42.0.0/16"   # Pod network (cluster-internal services)
      - "10.43.0.0/16"   # Service network (ClusterIP VIPs)
    execAllowlist:
      - git
      - curl
      - jq
      - python3

  # Browser tool — enabled with egress network restrictions
  browser:
    enabled: true

  # Shell tool — bubblewrap sandboxing disabled (requires unprivileged user
  # namespaces which K3s kernel doesn't allow). NetworkPolicy + exec allowlist
  # provide the security boundary instead.
  shell:
    enabled: true
    sandboxMode: disabled
# Network policy — egress + ingress
networkPolicy:
  enabled: true
  egress:
    # Allow HTTPS to public internet, block all private IP ranges
    allowPublicHTTPS: true
    # Allow DNS resolution
    allowDNS: true
    # Allow access to in-cluster services
    allowClusterServices:
      - name: home-assistant
        namespace: default
        port: 8123
        # HA uses hostNetwork, so traffic goes to the node IP (pi4-02)
        hostIP: "10.2.1.160"
      - name: immich
        namespace: default
        port: 2283
        labelKey: app
        labelValue: immich
  ingress:
    # Web UI from nginx-ingress only
    allowNginxIngress: true
    # Prometheus metrics scraping
    allowMonitoring: true
  cidrs:
    podNetwork: 10.42.0.0/16
    serviceNetwork: 10.43.0.0/16
# Prometheus monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
