{{- if .Values.velero.deployNodeAgent }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      name: node-agent
  template:
    metadata:
      labels:
        name: node-agent
        app: node-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.velero.serviceAccount.server.name }}
      securityContext:
        runAsUser: 0
      volumes:
        - name: host-pods
          hostPath:
            path: {{ .Values.velero.nodeAgent.podVolumePath }}
        - name: scratch
          emptyDir: {}
        - name: cloud-credentials
          secret:
            secretName: {{ .Values.velero.credentials.existingSecret }}
      containers:
        - name: node-agent
          image: {{ .Values.velero.image.repository }}:{{ .Values.velero.image.tag }}
          imagePullPolicy: {{ .Values.velero.image.pullPolicy }}
          command:
            - /velero
          args:
            - node-agent
            - server
          volumeMounts:
            - name: host-pods
              mountPath: /host_pods
              mountPropagation: HostToContainer
            - name: scratch
              mountPath: /scratch
            - name: cloud-credentials
              mountPath: /credentials
          env:
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
          resources:
{{ toYaml .Values.velero.nodeAgent.resources | indent 12 }}
{{- end }}
