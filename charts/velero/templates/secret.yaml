# This is a placeholder - the actual secret is managed via SealedSecret
# See sealed-secrets/velero-b2-credentials-sealed.yaml
#
# To create the sealed secret, first create a credentials file with:
#
# [default]
# aws_access_key_id=<YOUR_B2_APPLICATION_KEY_ID>
# aws_secret_access_key=<YOUR_B2_APPLICATION_KEY>
#
# Then create and seal the secret:
# kubectl create secret generic velero-b2-credentials \
#   --from-file=cloud=./credentials \
#   --namespace=velero \
#   --dry-run=client -o yaml | \
#   kubeseal -o yaml > charts/velero/sealed-secrets/velero-b2-credentials-sealed.yaml
