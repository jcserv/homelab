{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openclaw.fullname" . }}-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openclaw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from default namespace and ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 18789
        - protocol: TCP
          port: 18793
  egress:
    # DNS resolution via kube-dns
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # LiteLLM API proxy
    - ports:
        - protocol: TCP
          port: 4000
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
    # Squid egress proxy (all external HTTPS routed here)
    - ports:
        - protocol: TCP
          port: 3128
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: squid-proxy
    # Authentik callbacks within cluster
    - ports:
        - protocol: TCP
          port: 9000
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
{{- end }}
