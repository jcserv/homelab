apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: {{ include "openclaw.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  # OpenClaw configuration (openclaw.json)
  config:
    raw:
      gateway:
        bind: lan
        trustedProxies:
          {{- range $.Values.openclaw.gateway.trustedProxies }}
          - {{ . | quote }}
          {{- end }}
        controlUi:
          allowInsecureAuth: true # the instance is secured behind nginx
          dangerouslyDisableDeviceAuth: false # explicit for audit clarity
      {{- if .Values.discord.enabled }}
      {{- $secret := (lookup "v1" "Secret" .Values.namespace .Values.secretName) }}
      {{- $guildId := index $secret.data "DISCORD_GUILD_ID" | b64dec }}
      {{- $channelId := index $secret.data "DISCORD_CHANNEL_ID" | b64dec }}
      {{- $userId := index $secret.data "DISCORD_USER_ID" | b64dec }}
      plugins:
        entries:
          discord:
            enabled: true
      channels:
        discord:
          token: "${DISCORD_BOT_TOKEN}"
          groupPolicy: {{ .Values.discord.groupPolicy | quote }}
          guilds:
            {{ $guildId | quote }}:
              requireMention: {{ .Values.discord.guildRequireMention }}
              users:
                - {{ $userId | quote }}
              channels:
                {{ $channelId | quote }}:
                  allow: true
                  requireMention: {{ .Values.discord.channelRequireMention }}
      {{- end }}
      tools:
        exec:
          security: full
          ask: "always"

      # Route all AI providers through LiteLLM proxy (custom openai provider)
      models:
        mode: "merge"
        providers:
          litellm:
            baseUrl: "http://litellm.default.svc.cluster.local:4000/v1"
            apiKey: "${ANTHROPIC_API_KEY}"
            api: "openai-completions"
            models:
              - id: "claude-haiku-4-5-20251001"
                name: "Claude Haiku 4.5"
                contextWindow: 200000
                maxTokens: 8192
              - id: "claude-sonnet-4-5-20250929"
                name: "Claude Sonnet 4.5"
                contextWindow: 200000
                maxTokens: 8192
              - id: "claude-sonnet-4-20250514"
                name: "Claude Sonnet 4"
                contextWindow: 200000
                maxTokens: 8192
              - id: "llama3.2:3b"
                name: "Llama 3.2 3B"
                contextWindow: 8192
                maxTokens: 2048
              - id: "llama3.2:1b"
                name: "Llama 3.2 1B"
                contextWindow: 8192
                maxTokens: 2048

      # Token optimization - agent defaults
      agents:
        defaults:
          model:
            primary: "litellm/claude-haiku-4-5-20251001"
            fallbacks:
              - "litellm/claude-sonnet-4-5-20250929"
          models:
            litellm/claude-sonnet-4-5-20250929:
              alias: "sonnet"
            litellm/claude-haiku-4-5-20251001:
              alias: "haiku"
            litellm/claude-sonnet-4-20250514:
              alias: "sonnet4"
          # Heartbeat disabled - using cron job with Ollama instead
          contextPruning:
            mode: {{ .Values.agents.contextPruning.mode | quote }}
            ttl: {{ .Values.agents.contextPruning.ttl | quote }}
            keepLastAssistants: {{ .Values.agents.contextPruning.keepLastAssistants }}
          maxConcurrent: {{ .Values.agents.maxConcurrent }}

  # Environment variables (non-secret)
  env:
    {{- range $key, $value := .Values.env }}
    - name: {{ $key }}
      value: {{ $value | quote }}
    {{- end }}
    # Map ANTHROPIC_API_KEY (LiteLLM master key) to AUTH_TOKEN for unified endpoint
    - name: ANTHROPIC_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secretName }}
          key: ANTHROPIC_API_KEY
  # Secret references (API keys, tokens)
  envFrom:
    - secretRef:
        name: {{ .Values.secretName }}
    - secretRef:
        name: gmail-mcp-credentials

  # Main container resources
  resources:
    {{- toYaml .Values.resources.main | nindent 4 }}

  # Chromium browser sidecar
  chromium:
    enabled: {{ .Values.openclaw.chromium.enabled }}
    resources:
      {{- toYaml .Values.resources.chromium | nindent 6 }}

  # Persistent storage
  storage:
    persistence:
      enabled: true
      storageClass: {{ .Values.storage.storageClass }}
      size: {{ .Values.storage.size }}

  # Scheduling - prefer Pi5 nodes
  availability:
    {{- with .Values.affinity }}
    affinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  # Security hardening
  security:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    # Operator-managed network policy
    networkPolicy:
      enabled: true
      allowedIngressNamespaces:
        - ingress-nginx
      additionalEgress:
        # DNS resolution via kube-dns
        - ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
        # LiteLLM API proxy (replaces direct Anthropic API access)
        - ports:
            - protocol: TCP
              port: 4000
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
        # Squid egress proxy (replaces direct HTTPS access)
        - ports:
            - protocol: TCP
              port: 3128
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: squid-proxy
        # Authentik callbacks within cluster
        - ports:
            - protocol: TCP
              port: 9000
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: authentik

  # Disable operator-managed ingress (we create our own)
  networking:
    ingress:
      enabled: false
    service:
      type: ClusterIP
