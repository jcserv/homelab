apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: {{ include "openclaw.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  # OpenClaw configuration (openclaw.json)
  config:
    raw:
      gateway:
        bind: lan
        trustedProxies:
          {{- range $.Values.openclaw.gateway.trustedProxies }}
          - {{ . | quote }}
          {{- end }}
        controlUi:
          allowInsecureAuth: true # the instance is secured behind nginx
          dangerouslyDisableDeviceAuth: false # explicit for audit clarity
      # Tool execution security (sandbox/filesystem/mcp keys not supported in v0.6.0;
      # network-level restrictions via Squid + NetworkPolicy enforce egress controls instead)
      tools:
        exec:
          security: full
          ask: "always"

      plugins:
        entries:
          telegram:
            enabled: true

  # Environment variables (non-secret)
  env:
    {{- range $key, $value := .Values.env }}
    - name: {{ $key }}
      value: {{ $value | quote }}
    {{- end }}

  # Secret references (API keys, tokens)
  envFrom:
    - secretRef:
        name: {{ .Values.secretName }}

  # Main container resources
  resources:
    {{- toYaml .Values.resources.main | nindent 4 }}

  # Chromium browser sidecar
  chromium:
    enabled: {{ .Values.openclaw.chromium.enabled }}
    resources:
      {{- toYaml .Values.resources.chromium | nindent 6 }}

  # Persistent storage
  storage:
    persistence:
      enabled: true
      storageClass: {{ .Values.storage.storageClass }}
      size: {{ .Values.storage.size }}

  # Scheduling - prefer Pi5 nodes
  availability:
    {{- with .Values.affinity }}
    affinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  # Security hardening
  security:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    # Operator-managed network policy
    networkPolicy:
      enabled: true
      allowedIngressNamespaces:
        - ingress-nginx
      additionalEgress:
        # DNS resolution via kube-dns
        - ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
          to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
        # LiteLLM API proxy (replaces direct Anthropic API access)
        - ports:
            - protocol: TCP
              port: 4000
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
        # Squid egress proxy (replaces direct HTTPS access)
        - ports:
            - protocol: TCP
              port: 3128
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: squid-proxy
        # Authentik callbacks within cluster
        - ports:
            - protocol: TCP
              port: 9000
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: authentik

  # Disable operator-managed ingress (we create our own)
  networking:
    ingress:
      enabled: false
    service:
      type: ClusterIP
