---
namespace: default

# OpenClaw instance configuration
openclaw:
  chromium:
    enabled: true
  gateway:
    trustedProxies:
      - "10.42.0.0/24"  # pod CIDR on pi4-01
      - "10.42.1.0/24"  # pod CIDR on pi4-02
      - "10.42.2.0/24"  # pod CIDR on pi5-01
      - "10.42.3.0/24"  # pod CIDR on pi5-02

# Resource limits
resources:
  main:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  chromium:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Storage configuration
storage:
  storageClass: local-path
  size: 5Gi

# Prefer Pi5 nodes for memory headroom
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi5-01
                - pi5-02

# Environment variables (non-secret)
env:
  OPENCLAW_DISABLE_CLAWHUB: "true"
  OPENCLAW_TELEGRAM_ENABLED: "true"
  OPENCLAW_DISABLE_BONJOUR: "1"
  # LiteLLM API proxy - OpenClaw talks to LiteLLM instead of Anthropic directly
  ANTHROPIC_BASE_URL: "http://litellm.default.svc.cluster.local:4000"
  # Squid egress proxy - all external HTTPS routed through domain-filtered proxy
  HTTPS_PROXY: "http://squid-proxy.default.svc.cluster.local:3128"
  HTTP_PROXY: "http://squid-proxy.default.svc.cluster.local:3128"
  # Bypass proxy for cluster-internal traffic
  NO_PROXY: "10.0.0.0/8,127.0.0.1,localhost,.svc.cluster.local,.cluster.local"

# SealedSecrets: sealed-secrets/
# Contains: ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, OPENCLAW_GATEWAY_TOKEN
secretName: openclaw-secrets

# Service configuration
service:
  type: ClusterIP
  port: 18789

# Ingress (custom template with Authentik auth)
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: openclaw.jarrodservilla.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - openclaw.jarrodservilla.com
      secretName: wildcard-jarrodservilla-tls

# Pass-through values to the openclaw-operator
openclaw-operator: {}
