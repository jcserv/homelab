---
namespace: default

# OpenClaw instance configuration
openclaw:
  chromium:
    enabled: true
  gateway:
    trustedProxies:
      - "10.42.0.0/24"  # pod CIDR on pi4-01
      - "10.42.1.0/24"  # pod CIDR on pi4-02
      - "10.42.2.0/24"  # pod CIDR on pi5-01
      - "10.42.3.0/24"  # pod CIDR on pi5-02

# Resource limits
resources:
  main:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  chromium:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Storage configuration
storage:
  storageClass: local-path
  size: 5Gi

# Prefer Pi5 nodes for memory headroom
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi5-01
                - pi5-02

# Environment variables (non-secret)
env:
  OPENCLAW_DISABLE_CLAWHUB: "true"
  OPENCLAW_DISABLE_BONJOUR: "1"
  # LiteLLM API proxy - handles Anthropic SDK requests at /v1/messages
  ANTHROPIC_BASE_URL: "http://litellm.default.svc.cluster.local:4000"
  # Squid egress proxy - all external HTTPS routed through domain-filtered proxy
  HTTPS_PROXY: "http://squid-proxy.default.svc.cluster.local:3128"
  HTTP_PROXY: "http://squid-proxy.default.svc.cluster.local:3128"
  # Bypass proxy for cluster-internal traffic
  NO_PROXY: "10.0.0.0/8,127.0.0.1,localhost,.svc.cluster.local,.cluster.local,homeassistant.jarrodservilla.com,img.jarrodservilla.com"
  # gog CLI configuration
  XDG_CONFIG_HOME: "/home/openclaw/.openclaw/config"
  GOG_KEYRING_PASSWORD: "openclaw"
  GOG_ACCOUNT: "jarrod.servilla@gmail.com"
  PATH: "/home/openclaw/.openclaw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# SealedSecrets: sealed-secrets/
# Contains: ANTHROPIC_API_KEY, OPENCLAW_GATEWAY_TOKEN, DISCORD_BOT_TOKEN,
#           DISCORD_GUILD_ID, DISCORD_CHANNEL_ID, DISCORD_USER_ID
secretName: openclaw-secrets

# Service configuration
service:
  type: ClusterIP
  port: 18789

# Ingress (custom template with Authentik auth)
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: openclaw.jarrodservilla.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - openclaw.jarrodservilla.com
      secretName: wildcard-jarrodservilla-tls

# Token optimization - agent defaults
agents:
  defaultModel: "litellm/claude-haiku-4-5-20251001"
  fallbackModel: "litellm/claude-sonnet-4-5-20250929"
  heartbeat:
    every: "1h"
    model: "litellm/llama3.2:3b"
    target: "discord"
    prompt: "Check: Any blockers, progress updates, or opportunities?"
  contextPruning:
    mode: "cache-ttl"
    ttl: "6h"
    keepLastAssistants: 3
  maxConcurrent: 3

# Discord bot channel configuration
# IDs sealed in: sealed-secrets/openclaw-secrets-sealed.yaml
# (DISCORD_GUILD_ID, DISCORD_CHANNEL_ID, DISCORD_USER_ID)
discord:
  enabled: true
  groupPolicy: "allowlist"
  guildRequireMention: true
  channelRequireMention: false

# Chart-managed NetworkPolicy (replaces operator-managed policy)
networkPolicy:
  enabled: true

# Pass-through values to the openclaw-operator
openclaw-operator: {}
