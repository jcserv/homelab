# Global NetworkPolicy Configuration
# Namespace to deploy policies to
namespace: default

# Network CIDRs
trustedVLAN: "10.2.1.0/24"
tailscaleNetwork: "100.64.0.0/10"
podNetwork: "10.42.0.0/16"
serviceNetwork: "10.43.0.0/16"
nodeNetwork: "10.2.1.160/29"

# Enable/disable policies
policies:
  defaultDenyExternal: true
  blockNodeAccess: true
