apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-ingress-allow-web
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ingress-nginx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
  ingress:
    # Allow HTTP/HTTPS from Trusted VLAN and cluster
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
      from:
        # Allow from Trusted VLAN
        - ipBlock:
            cidr: 10.2.1.0/24
        # Allow from Tailscale network
        - ipBlock:
            cidr: 100.64.0.0/10
        # Allow from pod network
        - ipBlock:
            cidr: 10.42.0.0/16
        # Allow from cluster pods
        - podSelector: {}
        # Allow from all namespaces
        - namespaceSelector: {}

    # Allow metrics scraping from monitoring
    - ports:
        - protocol: TCP
          port: 10254
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
