# This chart wraps the official ingress-nginx Helm chart

namespace: ingress-nginx

# Pass-through values to the official ingress-nginx chart
ingress-nginx:
  controller:
    # Use DaemonSet for better HA across nodes
    kind: DaemonSet

    # Expose via LoadBalancer on a dedicated IP
    service:
      type: LoadBalancer
      loadBalancerIP: 10.2.1.200
      annotations:
        metallb.universe.tf/allow-shared-ip: nginx-ingress
      # Enable HTTPS
      ports:
        http: 80
        https: 443

    # Enable SSL passthrough for services that handle their own TLS
    extraArgs:
      enable-ssl-passthrough: true
      default-ssl-certificate: "cert-manager/wildcard-jarrodservilla-tls"

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    # Graceful shutdown configuration
    terminationGracePeriodSeconds: 120
    lifecycle:
      preStop:
        exec:
          command:
            - /bin/sh
            - -c
            - /wait-shutdown

    # Metrics for monitoring
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
        # Note: Enable this after installing monitoring stack, then upgrade:
        # helm upgrade nginx-ingress ./charts/nginx-ingress -n ingress-nginx
        additionalLabels:
          release: prometheus

    # Allow snippets for advanced configuration
    allowSnippetAnnotations: true

    # Enable annotation validation bypass for external auth
    config:
      annotation-value-word-blocklist: ""

    # Disable strict validation for external auth annotations
    admissionWebhooks:
      annotations: {}
      enabled: true
      patch:
        enabled: true
        # Disable annotation validation for auth snippets
        image:
          pullPolicy: IfNotPresent
      certManager:
        enabled: false
      # Disable risky annotation checks
      failurePolicy: Ignore

  # Default backend (optional - returns 404 for unmapped routes)
  # Disabled due to ARM architecture incompatibility
  defaultBackend:
    enabled: false
