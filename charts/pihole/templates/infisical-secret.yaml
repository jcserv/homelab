{{- /*
InfisicalSecret CR — POC for the Infisical Secrets Operator.
When .Values.infisical.enabled is true, the operator pulls secrets from the
self-hosted platform and materializes the `<fullname>-secrets` Secret (key
WEBPASSWORD), replacing the SealedSecret in sealed-secrets/.
Requires charts/infisical-secrets-operator to be installed.
See docs/runbooks/INFISICAL_OPERATOR.md.
*/ -}}
{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "pihole.fullname" . }}-infisical
  labels:
    app: {{ include "pihole.name" . }}
spec:
  hostAPI: {{ .Values.infisical.hostAPI | quote }}
  syncConfig:
    resyncInterval: {{ .Values.infisical.resyncInterval | quote }}
    instantUpdates: {{ .Values.infisical.instantUpdates }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug | quote }}
        envSlug: {{ .Values.infisical.envSlug | quote }}
        secretsPath: {{ .Values.infisical.secretsPath | quote }}
      credentialsRef:
        secretName: {{ .Values.infisical.credentialsRef.secretName | quote }}
        secretNamespace: {{ .Values.infisical.credentialsRef.secretNamespace | quote }}
  managedKubeSecretReferences:
    - secretName: {{ include "pihole.fullname" . }}-secrets
      secretNamespace: {{ .Release.Namespace }}
      # Owner: operator owns the Secret and deletes it with the CR.
      creationPolicy: "Owner"
      secretType: Opaque
      # Only materialize WEBPASSWORD. Without this, secretsPath "/" would copy
      # every secret in the env into this Secret. (For full isolation, move
      # WEBPASSWORD into a dedicated Infisical folder and set secretsPath.)
      template:
        includeAllSecrets: false
        data:
          WEBPASSWORD: "{{ `{{ .WEBPASSWORD.Value }}` }}"
{{- end }}
