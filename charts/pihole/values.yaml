---
# Deployment namespace
namespace: default
replicaCount: 4 # Four instances for high availability (synced via nebula-sync)
image:
  repository: pihole/pihole
  tag: 2025.11.0 # Pi-hole v6 required for nebula-sync
  pullPolicy: IfNotPresent
# Spread pods across different hosts for high availability
# Using preferred (not required) to allow scheduling when fewer nodes are available
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [pihole]
          topologyKey: kubernetes.io/hostname
resources:
  requests:
    memory: 200Mi
    cpu: 100m
  limits:
    memory: 300Mi
    cpu: 500m
storage:
  type: local-path # Using local storage - nebula-sync handles replication
  storageClass: local-path
  config:
    size: 1Gi
  dnsmasq:
    size: 500Mi
service:
  dns:
    type: LoadBalancer
    loadBalancerIP: 10.2.1.202
    externalTrafficPolicy: Local
    annotations:
      metallb.universe.tf/allow-shared-ip: pihole-dns
    ports:
      tcp: 53
      udp: 53
  # Admin service - pihole-0 only, for making configuration changes
  admin:
    type: ClusterIP
    ports:
      http: 80
# Ingress configuration for HTTPS access via pi.jarrodservilla.com
ingress:
  enabled: true
  className: nginx
  host: pi.jarrodservilla.com
  tlsSecretName: wildcard-jarrodservilla-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
# Environment variables
env:
  TZ: America/New_York

  # WEBPASSWORD - Admin password for Pi-hole web interface
  # Managed by SealedSecret (charts/pihole/sealed-secrets/pihole-secrets-sealed.yaml)
  # WEBPASSWORD: ""
  FTLCONF_LOCAL_IPV4: 10.2.1.202
  DNS1: 1.1.1.1 # Cloudflare DNS
  DNS2: 2606:4700:4700::1111 # Cloudflare DNS IPv6
  DNSMASQ_LISTENING: all
# Custom DNS entries
customDnsEntries:
  - 10.2.1.200 nginx.jarrodservilla.com
  - 10.2.1.200 img.jarrodservilla.com
  - 10.2.1.200 homeassistant.jarrodservilla.com
  - 10.2.1.200 pi.jarrodservilla.com
  - 10.2.1.200 grafana.jarrodservilla.com
  - 10.2.1.200 auth.jarrodservilla.com
  # NAS services
  - 10.2.1.200 qbittorrent.jarrodservilla.com
  - 10.2.1.200 radarr.jarrodservilla.com
  - 10.2.1.200 sonarr.jarrodservilla.com
  - 10.2.1.200 bazarr.jarrodservilla.com
  - 10.2.1.200 prowlarr.jarrodservilla.com
  - 10.2.1.200 jellyseerr.jarrodservilla.com
  - 10.2.1.200 jellyfin.jarrodservilla.com
# Custom blocklist entries
# Managed by SealedSecret (charts/pihole/sealed-secrets/pihole-custom-blocklist-sealed.yaml)
# customBlocklist: |
#   # ------------------------------------[FILTERS]-------------------------------------
#   udcm.yahoo.com
#   api-adservices.apple.com
#   books-analytics-events.apple.com
#   grs.hicloud.com
#   appmetrica.yandex.ru
#   business-api.tiktok.com
# Adlists to bootstrap on initialization
adlists:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://blocklistproject.github.io/Lists/ads.txt
  - https://blocklistproject.github.io/Lists/malware.txt
  - https://blocklistproject.github.io/Lists/ransomware.txt
  - https://blocklistproject.github.io/Lists/redirect.txt
  - https://blocklistproject.github.io/Lists/phishing.txt
  - https://blocklistproject.github.io/Lists/abuse.txt
  - https://blocklistproject.github.io/Lists/fraud.txt
  - https://blocklistproject.github.io/Lists/gambling.txt
  - https://blocklistproject.github.io/Lists/scam.txt
  - https://blocklistproject.github.io/Lists/tracking.txt
  - file:///var/www/html/pihole-blocklist.txt
# nebula-sync configuration for syncing between instances
nebulaSync:
  enabled: true
  image: ghcr.io/lovelaze/nebula-sync:latest
  schedule: "*/5 * * * *" # Every 5 minutes (reduced frequency to avoid timing issues)
  fullSync: true
  runGravity: false # Disabled to prevent connection issues during sync


  # IMPORTANT: These passwords MUST match env.WEBPASSWORD for authentication
  # primaryPassword: "changeme"  # Should match env.WEBPASSWORD
  # replicaPassword: "changeme"  # Should match env.WEBPASSWORD
