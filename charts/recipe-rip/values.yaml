---
namespace: default

recipe-rip:
  image:
    repository: ghcr.io/jcserv/recipe.rip
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: nginx
    host: recipe.jarrodservilla.com
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      enabled: true
      secretName: wildcard-jarrodservilla-tls

  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  existingSecret:
    name: recipe-rip-secrets
    keys:
      BETTER_AUTH_SECRET: better-auth-secret
      ANTHROPIC_API_KEY: anthropic-api-key
      TRANSCRIPT_API_KEY: transcript-api-key

  trustedProviders: "authentik"

  env: {}

# Infisical Secrets Operator integration.
# When enabled, the operator syncs secrets from the self-hosted Infisical
# platform into the managed K8s Secret(s), replacing the SealedSecret(s) in
# sealed-secrets/. Requires charts/infisical-secrets-operator + machine identity.
# Kept disabled until per-chart cutover (Phase 3). See
# docs/runbooks/INFISICAL_MIGRATION.md.
infisical:
  enabled: true
  # In-cluster Service URL — public hostname only resolves via pihole DNS,
  # which CoreDNS can't reach. Keeps operator traffic in-cluster.
  hostAPI: http://infisical-infisical-standalone-infisical.default.svc.cluster.local:8080/api
  resyncInterval: 60s
  instantUpdates: false
  projectSlug: homelab-nkcl
  envSlug: prod
  secretsPath: /recipe-rip
  credentialsRef:
    secretName: infisical-machine-identity
    secretNamespace: infisical-secrets-operator
