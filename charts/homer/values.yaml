replicaCount: 1

image:
  repository: b4bz/homer
  pullPolicy: IfNotPresent
  tag: "v24.05.1"

nameOverride: ""
fullnameOverride: ""

service:
  type: LoadBalancer
  loadBalancerIP: 10.2.1.205
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: home.jarrodservilla.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - home.jarrodservilla.com
      secretName: wildcard-jarrodservilla-tls

persistence:
  enabled: true
  storageClassName: local-path
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /www/assets

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
