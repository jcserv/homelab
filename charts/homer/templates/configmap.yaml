apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homer.fullname" . }}-config
  labels:
    {{- include "homer.labels" . | nindent 4 }}
data:
  config.yml: |
    ---
    # Homepage configuration
    title: "Homelab Dashboard"
    subtitle: "Jarrod's Homelab"
    # logo: "assets/logo.png"  # Commented out - using default Homer icon

    header: true
    footer: false

    # Optional theme
    theme: default
    colors:
      light:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#f5f5f5"
        card-background: "#ffffff"
        text: "#363636"
        text-header: "#ffffff"
        text-title: "#303030"
        text-subtitle: "#424242"
        card-shadow: rgba(0, 0, 0, 0.1)
        link: "#3273dc"
        link-hover: "#363636"
      dark:
        highlight-primary: "#3367d6"
        highlight-secondary: "#4285f4"
        highlight-hover: "#5a95f5"
        background: "#131313"
        card-background: "#2b2b2b"
        text: "#eaeaea"
        text-header: "#ffffff"
        text-title: "#fafafa"
        text-subtitle: "#f5f5f5"
        card-shadow: rgba(0, 0, 0, 0.4)
        link: "#3273dc"
        link-hover: "#ffdd57"

    # Optional navbar
    links:
      - name: "GitHub"
        icon: "fab fa-github"
        url: "https://github.com/jarrodservilla/homelab-k8s"
        target: "_blank"

    # Services
    services:
      - name: "Kubernetes"
        icon: "fas fa-dharmachakra"
        items:
          - name: "Immich"
            icon: "fas fa-images"
            subtitle: "Photo & Video Management"
            tag: "k8s"
            url: "https://img.jarrodservilla.com"
            target: "_blank"

          - name: "Home Assistant"
            icon: "fas fa-home"
            subtitle: "Home Automation"
            tag: "k8s"
            url: "https://homeassistant.jarrodservilla.com"
            target: "_blank"

          - name: "Grafana"
            icon: "fas fa-chart-line"
            subtitle: "Metrics & Dashboards"
            tag: "k8s"
            url: "https://grafana.jarrodservilla.com/d/raspberry-pi-cluster/homelab?orgId=1&from=now-1h&to=now&timezone=browser&var-datasource=prometheus&var-loki_datasource=P8E80F9AEF21F6940&var-node=$__all&var-instance=$__all&var-pod=$__all&var-log_level=$__all&var-log_filter="
            target: "_blank"

          - name: "Authentik"
            icon: "fas fa-user-shield"
            subtitle: "Identity & Access Management"
            tag: "k8s"
            url: "https://auth.jarrodservilla.com"
            target: "_blank"

          - name: "Pi-hole"
            icon: "fas fa-shield-alt"
            subtitle: "DNS & Ad Blocking"
            tag: "k8s"
            url: "https://pi.jarrodservilla.com/admin/"
            target: "_blank"

      - name: "Docker"
        icon: "fab fa-docker"
        items:
          - name: "Jellyfin"
            icon: "fas fa-film"
            subtitle: "Media Server"
            tag: "media"
            url: "https://jellyfin.jarrodservilla.com"
            target: "_blank"

          - name: "Jellyseerr"
            icon: "fas fa-ticket-alt"
            subtitle: "Media Requests"
            tag: "media"
            url: "https://jellyseerr.jarrodservilla.com"
            target: "_blank"

          - name: "qBittorrent"
            icon: "fas fa-download"
            subtitle: "Torrent Client"
            tag: "media"
            url: "https://qbittorrent.jarrodservilla.com"
            target: "_blank"

          - name: "Radarr"
            icon: "fas fa-video"
            subtitle: "Movie Management"
            tag: "media"
            url: "https://radarr.jarrodservilla.com"
            target: "_blank"

          - name: "Sonarr"
            icon: "fas fa-tv"
            subtitle: "TV Show Management"
            tag: "media"
            url: "https://sonarr.jarrodservilla.com"
            target: "_blank"

          - name: "Bazarr"
            icon: "fas fa-closed-captioning"
            subtitle: "Subtitle Management"
            tag: "media"
            url: "https://bazarr.jarrodservilla.com"
            target: "_blank"

          - name: "Prowlarr"
            icon: "fas fa-search"
            subtitle: "Indexer Manager"
            tag: "media"
            url: "https://prowlarr.jarrodservilla.com"
            target: "_blank"

      - name: "Cloud"
        icon: "fas fa-cloud"
        items:
          - name: "Unifi Network"
            icon: "fas fa-network-wired"
            subtitle: "Network Management"
            tag: "network"
            url: "https://unifi.ui.com"
            target: "_blank"

          - name: "Tailscale"
            icon: "fas fa-shield-alt"
            subtitle: "VPN Management"
            tag: "network"
            url: "https://login.tailscale.com/admin/machines"
            target: "_blank"

          - name: "Backblaze B2"
            icon: "fas fa-cloud-upload-alt"
            subtitle: "Backup Storage"
            tag: "backup"
            url: "https://tree-yyz1-0001.secure.backblaze.com/b2_browse_files2.htm"
            target: "_blank"
