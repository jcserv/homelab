# NAS Services Configuration
# Routes traffic from nginx-ingress to services running on NAS

# NAS IP address where all services are running
nasIP: "10.2.1.147"

# Base domain for all services
baseDomain: "jarrodservilla.com"

# TLS secret name (wildcard certificate managed by cert-manager)
tlsSecretName: "wildcard-jarrodservilla-tls"

# Ingress class to use
ingressClassName: "nginx"

# Service definitions
services:
  qbittorrent:
    enabled: true
    port: 8888
    subdomain: qbittorrent

  radarr:
    enabled: true
    port: 7878
    subdomain: radarr
    # Use Authentik outpost in proxy mode
    useAuthentikProxy: true
    # Pass Authorization header from Authentik to backend
    proxyAuthHeaders: true

  sonarr:
    enabled: true
    port: 8989
    subdomain: sonarr
    # Use Authentik outpost in proxy mode
    useAuthentikProxy: true
    # Pass Authorization header from Authentik to backend
    proxyAuthHeaders: true

  bazarr:
    enabled: true
    port: 6767
    subdomain: bazarr
    # Use Authentik outpost in proxy mode
    useAuthentikProxy: true
    # Pass Authorization header from Authentik to backend
    proxyAuthHeaders: true

  prowlarr:
    enabled: true
    port: 9696
    subdomain: prowlarr
    # Use Authentik outpost in proxy mode
    useAuthentikProxy: true

  jellyseerr:
    enabled: true
    port: 5055
    subdomain: jellyseerr
    # Use Authentik outpost in proxy mode
    useAuthentikProxy: true

  jellyfin:
    enabled: true
    port: 8899
    subdomain: jellyfin

# Monitoring configuration
monitoring:
  nodeExporter:
    enabled: true
    port: 9100
