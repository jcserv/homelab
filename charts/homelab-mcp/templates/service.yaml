apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-mcp.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-mcp.labels" . | nindent 4 }}
    component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "homelab-mcp.selectorLabels" . | nindent 4 }}
    component: app
