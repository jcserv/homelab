apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab-mcp.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-mcp.labels" . | nindent 4 }}
    component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homelab-mcp.selectorLabels" . | nindent 6 }}
      component: app
  template:
    metadata:
      labels:
        {{- include "homelab-mcp.selectorLabels" . | nindent 8 }}
        component: app
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homelab-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Image USER is the named user `app` (UID 10001 per its Dockerfile).
            # runAsNonRoot can't verify a non-numeric user, so pin the UID.
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: APP_TRANSPORT
              value: {{ .Values.app.transport | quote }}
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: {{ .Values.service.port | quote }}
            {{- range $envName, $secretKey := .Values.existingSecret.keys }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret.name }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Image needs a writable /tmp (readOnlyRootFilesystem: true).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
