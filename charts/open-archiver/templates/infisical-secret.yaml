{{- /*
InfisicalSecret CR — sole secret source for this chart (no sealed-secrets).
The operator pulls secrets from Infisical (folder /open-archiver) and
materializes the `open-archiver-secrets` Secret. `database-url` is composed
here from postgres-password so it never has to be stored pre-assembled.
See docs/runbooks/INFISICAL_MIGRATION.md.
*/ -}}
{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: open-archiver-infisical
  labels:
    app: open-archiver
spec:
  hostAPI: {{ .Values.infisical.hostAPI | quote }}
  syncConfig:
    resyncInterval: {{ .Values.infisical.resyncInterval | quote }}
    instantUpdates: {{ .Values.infisical.instantUpdates }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug | quote }}
        envSlug: {{ .Values.infisical.envSlug | quote }}
        secretsPath: {{ .Values.infisical.secretsPath | quote }}
      credentialsRef:
        secretName: {{ .Values.infisical.credentialsRef.secretName | quote }}
        secretNamespace: {{ .Values.infisical.credentialsRef.secretNamespace | quote }}
  managedKubeSecretReferences:
    - secretName: {{ .Values.existingSecret.name }}
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: "Owner"
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          postgres-password: '{{ `{{ (index . "postgres-password").Value }}` }}'
          database-url: '{{ `postgresql://openarchiver:{{ (index . "postgres-password").Value }}@open-archiver-postgres:5432/open_archive` }}'
          meili-master-key: '{{ `{{ (index . "meili-master-key").Value }}` }}'
          jwt-secret: '{{ `{{ (index . "jwt-secret").Value }}` }}'
          encryption-key: '{{ `{{ (index . "encryption-key").Value }}` }}'
          storage-encryption-key: '{{ `{{ (index . "storage-encryption-key").Value }}` }}'
          s3-access-key-id: '{{ `{{ (index . "s3-access-key-id").Value }}` }}'
          s3-secret-access-key: '{{ `{{ (index . "s3-secret-access-key").Value }}` }}'
{{- end }}
