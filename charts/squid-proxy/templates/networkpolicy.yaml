{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "squid-proxy.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "squid-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "squid-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept proxy traffic from OpenClaw and LiteLLM
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # HTTPS egress to allowed domains
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
