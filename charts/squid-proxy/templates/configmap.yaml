apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "squid-proxy.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "squid-proxy.labels" . | nindent 4 }}
data:
  squid.conf: |
    # Squid proxy configuration for domain-level egress filtering
    # Only allows HTTPS CONNECT to explicitly whitelisted domains

    # ACL definitions
    acl localnet src 10.0.0.0/8
    acl SSL_ports port 443
    acl Safe_ports port 443
    acl CONNECT method CONNECT

    # Domain allowlist
    acl allowed_domains dstdomain {{ range .Values.allowedDomains }}{{ . }} {{ end }}

    # Access rules
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    # Allow CONNECT to whitelisted domains only
    http_access allow CONNECT allowed_domains
    http_access allow allowed_domains

    # Deny everything else
    http_access deny all

    # Listener
    http_port {{ .Values.service.port }}

    # Logging to syslog for Loki collection (squid drops to 'proxy' user, can't write /dev/stdout)
    access_log syslog:daemon
    cache_log syslog:daemon

    # Disable caching (we're just proxying)
    cache deny all

    # Security: hide version and internal info
    httpd_suppress_version_string on
    forwarded_for delete
    via off
