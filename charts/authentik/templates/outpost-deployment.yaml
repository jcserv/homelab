apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-outpost
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: outpost
        image: ghcr.io/goauthentik/proxy:{{ .Values.server.image.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        - name: https
          containerPort: 9443
          protocol: TCP
        - name: metrics
          containerPort: 9300
          protocol: TCP
        env:
        - name: AUTHENTIK_HOST
          value: "https://{{ .Values.ingress.host }}"
        - name: AUTHENTIK_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-outpost-token
              key: token
        - name: AUTHENTIK_INSECURE
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /outpost.goauthentik.io/ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /outpost.goauthentik.io/ping
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
