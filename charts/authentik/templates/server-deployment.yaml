apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "authentik.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authentik.server.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: authentik
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: http-metrics
              containerPort: 9300
              protocol: TCP
            - name: https
              containerPort: 9443
              protocol: TCP
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentik.secretKey.secretName }}
                  key: {{ .Values.authentik.secretKey.key }}
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: {{ .Values.authentik.errorReporting.enabled | quote }}
            - name: AUTHENTIK_LOG_LEVEL
              value: {{ .Values.authentik.logLevel }}
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: {{ .Values.authentik.postgresql.host }}
            - name: AUTHENTIK_POSTGRESQL__PORT
              value: {{ .Values.authentik.postgresql.port | quote }}
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: {{ .Values.authentik.postgresql.name }}
            - name: AUTHENTIK_POSTGRESQL__USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentik.postgresql.user.secretName }}
                  key: {{ .Values.authentik.postgresql.user.key }}
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentik.postgresql.password.secretName }}
                  key: {{ .Values.authentik.postgresql.password.key }}
            - name: AUTHENTIK_REDIS__HOST
              value: {{ .Values.authentik.redis.host }}
            - name: AUTHENTIK_REDIS__PORT
              value: {{ .Values.authentik.redis.port | quote }}
            - name: AUTHENTIK_REDIS__DB
              value: {{ .Values.authentik.redis.db | quote }}
            {{- if .Values.authentik.email.enabled }}
            - name: AUTHENTIK_EMAIL__HOST
              value: {{ .Values.authentik.email.host }}
            - name: AUTHENTIK_EMAIL__PORT
              value: {{ .Values.authentik.email.port | quote }}
            - name: AUTHENTIK_EMAIL__USERNAME
              value: {{ .Values.authentik.email.username }}
            - name: AUTHENTIK_EMAIL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentik.email.password.secretName }}
                  key: {{ .Values.authentik.email.password.key }}
            - name: AUTHENTIK_EMAIL__USE_TLS
              value: {{ .Values.authentik.email.useTls | quote }}
            - name: AUTHENTIK_EMAIL__FROM
              value: {{ .Values.authentik.email.from }}
            {{- end }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: media
              mountPath: /media
            - name: templates
              mountPath: /templates
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 50
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
        - name: templates
          persistentVolumeClaim:
            claimName: authentik-templates
