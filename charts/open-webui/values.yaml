---
namespace: default

open-webui:
  ollama:
    enabled: false

  pipelines:
    enabled: false

  ollamaUrls:
    - "http://ollama.default.svc.cluster.local:11434"

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  ingress:
    enabled: true
    class: nginx
    host: ai.jarrodservilla.com
    tls: true
    existingSecret: wildcard-jarrodservilla-tls
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/enable-external-auth-annotations: "true"
      nginx.ingress.kubernetes.io/auth-url: >-
        http://authentik-outpost.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
      nginx.ingress.kubernetes.io/auth-signin: >-
        https://auth.jarrodservilla.com/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
      nginx.ingress.kubernetes.io/auth-request-redirect: >-
        $scheme://$http_host$request_uri
      nginx.ingress.kubernetes.io/auth-response-headers: >-
        Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid

  image:
    tag: v0.8.1-slim

  copyAppData:
    command:
      - sh
      - -c
    args:
      - mkdir -p /tmp/app-data

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
