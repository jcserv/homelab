---
namespace: default

# Schedule for security audit (cron format)
schedule: "0 2 * * 0"  # Sunday at 2:00 AM

image:
  repository: bitnami/kubectl
  tag: "1.31"
  pullPolicy: IfNotPresent

# OpenClaw instance to audit
openclaw:
  instanceName: openclaw
  namespace: default

# Expected security settings to validate
checks:
  # Verify these NetworkPolicy rules exist
  networkPolicy: true
  # Verify pod security context
  podSecurity: true
  # Verify secrets are sealed (not plain)
  sealedSecrets: true
  # Verify ingress has auth annotations
  ingressAuth: true

# Job settings
jobSettings:
  backoffLimit: 1
  restartPolicy: Never
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 300

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m

# RBAC for reading cluster resources
rbac:
  create: true

# Monitoring
monitoring:
  prometheusRule:
    enabled: true
    # Alert if audit hasn't run in 8 days
    auditMissingHours: 192
    # Alert if audit takes longer than 5 minutes
    auditDurationMinutes: 5
