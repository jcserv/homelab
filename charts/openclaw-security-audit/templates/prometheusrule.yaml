{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "openclaw-security-audit.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openclaw-security-audit.labels" . | nindent 4 }}
    release: monitoring-stack
spec:
  groups:
  - name: openclaw-security-audit.rules
    interval: 60s
    rules:
    # Alert if the security audit job has failed
    - alert: OpenClawSecurityAuditFailed
      expr: |
        kube_job_status_failed{job_name=~"{{ include "openclaw-security-audit.fullname" . }}-.*"} > 0
      for: 5m
      labels:
        severity: critical
        component: security
        service: openclaw
      annotations:
        summary: "OpenClaw security audit failed"
        description: "The OpenClaw security audit job {{ "{{" }} $labels.job_name {{ "}}" }} has failed. One or more security checks did not pass."

    # Alert if no successful audit in the configured window
    - alert: OpenClawSecurityAuditMissing
      expr: |
        (time() - kube_job_status_completion_time{job_name=~"{{ include "openclaw-security-audit.fullname" . }}-.*"} > {{ .Values.monitoring.prometheusRule.auditMissingHours }} * 3600)
        or
        (absent(kube_job_status_completion_time{job_name=~"{{ include "openclaw-security-audit.fullname" . }}-.*"}))
      for: 10m
      labels:
        severity: warning
        component: security
        service: openclaw
      annotations:
        summary: "OpenClaw security audit has not run recently"
        description: "No successful OpenClaw security audit in the last {{ .Values.monitoring.prometheusRule.auditMissingHours }} hours."

    # Alert if the audit job is taking too long
    - alert: OpenClawSecurityAuditDurationHigh
      expr: |
        (time() - kube_job_status_start_time{job_name=~"{{ include "openclaw-security-audit.fullname" . }}-.*"})
        and
        (kube_job_status_active{job_name=~"{{ include "openclaw-security-audit.fullname" . }}-.*"} > 0)
        > {{ .Values.monitoring.prometheusRule.auditDurationMinutes }} * 60
      for: 5m
      labels:
        severity: warning
        component: security
        service: openclaw
      annotations:
        summary: "OpenClaw security audit is taking too long"
        description: "The security audit job has been running for more than {{ .Values.monitoring.prometheusRule.auditDurationMinutes }} minutes."
{{- end }}
