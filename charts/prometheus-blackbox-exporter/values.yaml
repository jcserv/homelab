prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter

  # Configure probe modules
  config:
    modules:
      # HTTP probe (useful for web services)
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []  # Defaults to 2xx
          method: GET
          preferred_ip_protocol: "ip4"

      # HTTP probe that accepts 2xx and 403 (for services requiring auth)
      http_2xx_403:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 202, 203, 204, 205, 206, 403]
          method: GET
          preferred_ip_protocol: "ip4"

      # HTTP probe that accepts 2xx and 404 (for services with no default page)
      http_2xx_404:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 202, 203, 204, 205, 206, 404]
          method: GET
          preferred_ip_protocol: "ip4"

      # HTTP probe that accepts 2xx and common auth errors (401, 403)
      http_2xx_auth:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 202, 203, 204, 205, 206, 401, 403]
          method: GET
          preferred_ip_protocol: "ip4"

      # HTTPS probe
      https_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
          preferred_ip_protocol: "ip4"
          tls_config:
            insecure_skip_verify: false

      # Custom HTTP probes with Host headers
      http_pihole:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
          preferred_ip_protocol: "ip4"
          headers:
            Host: pi.jarrodservilla.com

      http_homeassistant:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
          preferred_ip_protocol: "ip4"
          headers:
            Host: homeassistant.jarrodservilla.com

      http_grafana:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          method: GET
          preferred_ip_protocol: "ip4"
          headers:
            Host: grafana.jarrodservilla.com

      # DNS probe for checking DNS resolution
      dns_udp:
        prober: dns
        timeout: 5s
        dns:
          query_name: "google.com"
          query_type: "A"
          valid_rcodes:
            - NOERROR
          transport_protocol: "udp"
          preferred_ip_protocol: "ip4"

      # TCP DNS probe
      dns_tcp:
        prober: dns
        timeout: 5s
        dns:
          query_name: "google.com"
          query_type: "A"
          valid_rcodes:
            - NOERROR
          transport_protocol: "tcp"
          preferred_ip_protocol: "ip4"

      # ICMP probe for ping checks
      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: "ip4"

  # ServiceMonitor for Prometheus Operator to scrape
  serviceMonitor:
    enabled: true
    defaults:
      labels:
        release: monitoring-stack
      interval: 60s
      scrapeTimeout: 30s
    targets:
      # Pi-hole DNS check
      - name: pihole-dns
        url: 10.0.0.202:53
        module: dns_udp
        labels:
          service: pihole
          type: dns

      # Unbound DNS check
      - name: unbound-dns
        url: unbound-0.default.svc.cluster.local:53
        module: dns_udp
        labels:
          service: unbound
          type: dns

      # HTTP checks for critical services via internal Kubernetes services
      - name: pihole-http
        url: http://pihole-admin.default.svc.cluster.local
        module: http_2xx_403
        labels:
          service: pihole
          type: http

      - name: homeassistant-http
        url: http://home-assistant.default.svc.cluster.local:8123
        module: http_2xx
        labels:
          service: homeassistant
          type: http

      - name: grafana-http
        url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
        module: http_2xx
        labels:
          service: grafana
          type: http

      - name: nginx-ingress-http
        url: http://nginx-ingress-ingress-nginx-controller.ingress-nginx.svc.cluster.local
        module: http_2xx_404
        labels:
          service: nginx-ingress
          type: http

      - name: immich-http
        url: http://immich.default.svc.cluster.local:2283
        module: http_2xx_auth
        labels:
          service: immich
          type: http

      - name: filebrowser-http
        url: http://filebrowser.default.svc.cluster.local
        module: http_2xx_auth
        labels:
          service: filebrowser
          type: http

  # Resource limits for homelab
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

  # Deploy to monitoring namespace
  namespaceOverride: monitoring

  # Additional pod labels
  podLabels:
    app: blackbox-exporter

  # Security context - enable NET_RAW capability for ICMP probes
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0

  securityContext:
    capabilities:
      add:
        - NET_RAW
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    runAsUser: 0

  # Prometheus Operator PodMonitor (alternative to ServiceMonitor)
  # We'll use ServiceMonitor instead, so this is disabled
  podMonitor:
    enabled: false

  # Allow running on all nodes
  tolerations: []
  affinity: {}
