apiVersion: v1
kind: Service
metadata:
  name: {{ include "unbound.fullname" . }}-1
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "unbound.fullname" . }}-1
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ index .Values.service.loadBalancerIPs 1 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
    - port: {{ .Values.service.port }}
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
  selector:
    {{- include "unbound.selectorLabels" . | nindent 4 }}
    statefulset.kubernetes.io/pod-name: {{ include "unbound.fullname" . }}-1
