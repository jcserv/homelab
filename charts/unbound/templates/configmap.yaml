apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "unbound.fullname" . }}-config
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
data:
  unbound.conf: |
    server:
        # Network configuration
        interface: {{ .Values.config.server.interface }}
        port: {{ .Values.config.server.port }}
        do-ip4: {{ .Values.config.server.doIp4 }}
        do-ip6: {{ .Values.config.server.doIp6 }}
        do-udp: {{ .Values.config.server.doUdp }}
        do-tcp: {{ .Values.config.server.doTcp }}

        # Access control
        {{- range .Values.config.server.accessControl }}
        access-control: {{ . }}
        {{- end }}

        # Privacy settings
        hide-identity: {{ .Values.config.server.hideIdentity }}
        hide-version: {{ .Values.config.server.hideVersion }}
        qname-minimisation: {{ .Values.config.server.qnameMinimisation }}
        aggressive-nsec: {{ .Values.config.server.aggressiveNsec }}

        # DNSSEC validation
        module-config: {{ .Values.config.server.moduleConfig | quote }}
        auto-trust-anchor-file: {{ .Values.config.server.autoTrustAnchorFile | quote }}
        val-clean-additional: {{ .Values.config.server.valCleanAdditional }}

        # Performance tuning
        num-threads: {{ .Values.config.server.numThreads }}
        msg-cache-slabs: {{ .Values.config.server.msgCacheSlabs }}
        rrset-cache-slabs: {{ .Values.config.server.rrsetCacheSlabs }}
        infra-cache-slabs: {{ .Values.config.server.infraCacheSlabs }}
        key-cache-slabs: {{ .Values.config.server.keyCacheSlabs }}

        # Cache settings
        cache-min-ttl: {{ .Values.config.server.cacheMinTtl }}
        cache-max-ttl: {{ .Values.config.server.cacheMaxTtl }}
        msg-cache-size: {{ .Values.config.server.msgCacheSize }}
        rrset-cache-size: {{ .Values.config.server.rrsetCacheSize }}

        # Prefetching
        prefetch: {{ .Values.config.server.prefetch }}
        prefetch-key: {{ .Values.config.server.prefetchKey }}

        # Serve expired
        serve-expired: {{ .Values.config.server.serveExpired }}
        serve-expired-ttl: {{ .Values.config.server.serveExpiredTtl }}
        serve-expired-ttl-reset: {{ .Values.config.server.serveExpiredTtlReset }}

        # Logging
        verbosity: {{ .Values.config.server.verbosity }}
        log-queries: {{ .Values.config.server.logQueries }}

        # Security
        unwanted-reply-threshold: {{ .Values.config.server.unwantedReplyThreshold }}
        {{- range .Values.config.server.privateAddress }}
        private-address: {{ . }}
        {{- end }}
