---
# Library PV (NFS storage for photos/videos on UGREEN NAS)
# This is the ONLY static PV - postgres and ML cache use local-path dynamic provisioning
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "immich.fullname" . }}-library-pv
  labels:
    app: {{ include "immich.name" . }}
    type: nfs-storage
spec:
  capacity:
    storage: {{ .Values.storage.library.size }}
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.library.storageClass | quote }}
  nfs:
    server: {{ .Values.storage.library.nfs.server }}
    path: {{ .Values.storage.library.nfs.path }}
  # Note: No nodeAffinity needed for NFS - can run on any node
