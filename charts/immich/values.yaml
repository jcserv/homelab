namespace: default

replicaCount: 1

image:
  server:
    repository: ghcr.io/immich-app/immich-server
    tag: "v2.3.1"
    pullPolicy: IfNotPresent
  machinelearning:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v2.3.1"
    pullPolicy: IfNotPresent

# Component-specific node affinity
componentAffinity:
  # Server can now run on any node (using NFS)
  server:
    required: false  # Changed from true - NFS is network accessible
    nodeSelector:
      storage-type: "hdd"

  machinelearning:
    required: true  # Require storage node for ML workload
    nodeSelector:
      storage: "true"  # MUST run on pi5-01

  postgres:
    required: false
    preferredNodes:
      - key: storage
        weight: 100

resources:
  server:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "3000m"
  machinelearning:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

storage:
  # Media library (photos/videos) - NFS on UGREEN NAS
  library:
    storageClass: ""  # Use empty string for static PVs
    size: 500Gi
    # hostPath: /mnt/hd1/Library  # OLD: Local HDD storage
    nfs:
      server: 10.2.1.147
      path: /volume1/Library

  # Database - local-path provisioner (dynamic)
  database:
    storageClass: local-path
    size: 20Gi

  # ML model cache - local-path provisioner (dynamic)
  modelCache:
    storageClass: local-path
    size: 10Gi

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: tensorchord/pgvecto-rs
    tag: pg14-v0.2.0
  auth:
    database: immich
    username: postgres
    existingSecret: immich-secrets
    secretKeys:
      adminPasswordKey: DB_PASSWORD
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    existingClaim: immich-postgres-pvc

# Service configuration
service:
  type: ClusterIP
  port: 2283

# Environment variables
env:
  DB_HOSTNAME: immich-postgres
  DB_PORT: "5432"
  DB_DATABASE_NAME: immich
  DB_USERNAME: postgres
  REDIS_HOSTNAME: valkey
  REDIS_PORT: "6379"
  REDIS_DBINDEX: "0"
  IMMICH_WEB_URL: https://img.jarrodservilla.com
  IMMICH_SERVER_URL: http://immich:2283

# Secrets Configuration
# NOTE: Secrets are managed via SealedSecrets in
# sealed-secrets/immich-secrets-sealed.yaml
# Do not define secrets here as they will override the sealed secrets
secrets: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Restrict to trusted VLAN + Tailscale (excludes IoT)
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.2.1.0/24,100.64.0.0/10"
  hosts:
    - host: img.jarrodservilla.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - img.jarrodservilla.com
      secretName: wildcard-jarrodservilla-tls
