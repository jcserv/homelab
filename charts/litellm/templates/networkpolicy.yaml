{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "litellm.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only accept traffic from OpenClaw pods
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowedIngressLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # HTTPS egress to Anthropic API (via Squid proxy)
    - ports:
        - protocol: TCP
          port: 443
    # Ollama API within cluster
    - ports:
        - protocol: TCP
          port: 11434
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
{{- end }}
