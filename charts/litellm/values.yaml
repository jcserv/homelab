---
namespace: default

image:
  repository: ghcr.io/berriai/litellm
  tag: "main-v1.81.3-stable"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 4000

# LiteLLM model configuration
config:
  model_list:
    - model_name: "claude-sonnet-4-20250514"
      litellm_params:
        model: "anthropic/claude-sonnet-4-20250514"
        api_key: "os.environ/ANTHROPIC_API_KEY"
    - model_name: "claude-sonnet-4-5-20250929"
      litellm_params:
        model: "anthropic/claude-sonnet-4-5-20250929"
        api_key: "os.environ/ANTHROPIC_API_KEY"
    - model_name: "claude-haiku-3-5-20241022"
      litellm_params:
        model: "anthropic/claude-haiku-3-5-20241022"
        api_key: "os.environ/ANTHROPIC_API_KEY"
    - model_name: "claude-haiku-4-5-20251001"
      litellm_params:
        model: "anthropic/claude-haiku-4-5-20251001"
        api_key: "os.environ/ANTHROPIC_API_KEY"
    - model_name: "llama3.2:3b"
      litellm_params:
        model: "ollama/llama3.2:3b"
        api_base: "http://ollama.default.svc.cluster.local:11434"
    - model_name: "llama3.2:1b"
      litellm_params:
        model: "ollama/llama3.2:1b"
        api_base: "http://ollama.default.svc.cluster.local:11434"
    - model_name: "tinyllama"
      litellm_params:
        model: "ollama/tinyllama:latest"
        api_base: "http://ollama.default.svc.cluster.local:11434"
  litellm_settings:
    drop_params: true
  general_settings:
    master_key: "os.environ/LITELLM_MASTER_KEY"
    max_budget: 50
    budget_duration: "30d"
    max_parallel_requests: 5

# SealedSecret containing ANTHROPIC_API_KEY and LITELLM_MASTER_KEY
secretName: litellm-secrets

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# NetworkPolicy: only accept from OpenClaw, egress to DNS + HTTPS
networkPolicy:
  enabled: true
  allowedIngressLabels:
    app.kubernetes.io/name: openclaw
