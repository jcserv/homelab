# This chart wraps the official cert-manager Helm chart

namespace: cert-manager

cert-manager:
  crds:
    enabled: true

  global:
    leaderElection:
      namespace: cert-manager

    # Pod disruption budgets for high availability
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  # Controller resources
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Pod topology spread for balanced distribution across nodes
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cert-manager
          app.kubernetes.io/component: controller

  # Webhook configuration
  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Pod topology spread for balanced distribution across nodes
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cert-manager
            app.kubernetes.io/component: webhook

  # CA injector configuration
  cainjector:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Pod topology spread for balanced distribution across nodes
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cert-manager
            app.kubernetes.io/component: cainjector

# Infisical Secrets Operator integration.
# When enabled, the operator syncs secrets from the self-hosted Infisical
# platform into the managed K8s Secret(s), replacing the SealedSecret(s) in
# sealed-secrets/. Requires charts/infisical-secrets-operator + machine identity.
# Kept disabled until per-chart cutover (Phase 3). See
# docs/runbooks/INFISICAL_MIGRATION.md.
infisical:
  enabled: true
  # In-cluster Service URL — public hostname only resolves via pihole DNS,
  # which CoreDNS can't reach. Keeps operator traffic in-cluster.
  hostAPI: http://infisical-infisical-standalone-infisical.default.svc.cluster.local:8080/api
  resyncInterval: 60s
  instantUpdates: false
  projectSlug: homelab-nkcl
  envSlug: prod
  secretsPath: /cert-manager
  credentialsRef:
    secretName: infisical-machine-identity
    secretNamespace: infisical-secrets-operator
