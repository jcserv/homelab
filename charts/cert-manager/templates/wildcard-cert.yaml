---
# Wildcard certificate for *.jarrodservilla.com domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jarrodservilla-cert
  namespace: cert-manager
spec:
  secretName: wildcard-jarrodservilla-tls
  duration: 2160h # 90 days (Let's Encrypt default)
  renewBefore: 720h # 30 days
  commonName: "*.jarrodservilla.com"
  dnsNames:
    - "*.jarrodservilla.com"
    - "jarrodservilla.com"
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: cloudflare-issuer
    kind: ClusterIssuer
    group: cert-manager.io
