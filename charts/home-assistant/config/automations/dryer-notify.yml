alias: Dryer done -> Notify
description: ""
triggers:
  - trigger: state
    entity_id:
      - event.washtower_notification
    to: null
conditions: []
actions:
  - action: notify.mobile_app_jarrod
    metadata: {}
    data:
      message: Dry complete
  - if:
      - condition: time
        after: "08:00:00"
        before: "23:00:00"
    then:
      - action: tts.speak
        metadata: {}
        data:
          cache: true
          media_player_entity_id: media_player.living_room_speaker
          message: Dry complete
        target:
          entity_id: tts.google_translate_en_com
mode: single
