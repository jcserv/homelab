alias: B1 - Bright lamp
description: ""
triggers:
  - device_id: 2924a2def320c6d4391ad023b29c3902
    domain: zha
    type: remote_button_short_press
    subtype: button_1
    trigger: device
conditions: []
actions:
  - if:
      - condition: state
        entity_id: light.living_room_lamp
        state:
          - "off"
    then:
      - action: light.turn_on
        metadata: {}
        data:
          color_temp_kelvin: 6500
          brightness_pct: 100
        target:
          entity_id: light.living_room_lamp
    else:
      - if:
          - condition: numeric_state
            entity_id: light.living_room_lamp
            attribute: brightness
            above: 254
            below: 256
        then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: light.living_room_lamp
        else:
          - action: light.turn_on
            metadata: {}
            data:
              brightness_pct: 100
              color_temp_kelvin: 6500
            target:
              entity_id: light.living_room_lamp
mode: single
