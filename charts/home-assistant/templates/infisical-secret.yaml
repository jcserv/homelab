{{- /*
InfisicalSecret CR. When .Values.infisical.enabled is true, the operator pulls
the OAuth credentials from Infisical (folder /home-assistant) and materializes
the `home-assistant-oauth` Secret, replacing the SealedSecret in sealed-secrets/.
See docs/runbooks/INFISICAL_MIGRATION.md.
*/ -}}
{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: home-assistant-infisical
  labels:
    app: {{ include "home-assistant.name" . }}
spec:
  hostAPI: {{ .Values.infisical.hostAPI | quote }}
  syncConfig:
    resyncInterval: {{ .Values.infisical.resyncInterval | quote }}
    instantUpdates: {{ .Values.infisical.instantUpdates }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ .Values.infisical.projectSlug | quote }}
        envSlug: {{ .Values.infisical.envSlug | quote }}
        secretsPath: {{ .Values.infisical.secretsPath | quote }}
      credentialsRef:
        secretName: {{ .Values.infisical.credentialsRef.secretName | quote }}
        secretNamespace: {{ .Values.infisical.credentialsRef.secretNamespace | quote }}
  managedKubeSecretReferences:
    - secretName: home-assistant-oauth
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: "Owner"
      secretType: Opaque
      template:
        includeAllSecrets: false
        data:
          client_id: "{{ `{{ .client_id.Value }}` }}"
          client_secret: "{{ `{{ .client_secret.Value }}` }}"
{{- end }}
