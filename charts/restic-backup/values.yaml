# Restic backup CronJob configuration

namespace: default

schedule: "0 2 1 * *" # Monthly at 2 AM on the 1st

image:
  repository: restic/restic
  tag: "latest"
  pullPolicy: IfNotPresent

# Node affinity - NFS can run on any node, no restrictions needed
nodeSelector: {}

affinity: {}

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "500m"
  limits:
    memory: "512Mi"
    cpu: "2000m"

# Backup source configuration
backup:
  filesPath: /mnt/nas/files
  libraryPath: /mnt/nas/library
  tag: ugreen-nas

# NFS storage configuration
storage:
  files:
    storageClass: "" # Use empty string for static PVs
    size: 500Gi
    nfs:
      server: 10.2.1.147
      path: /volume1/Files
  library:
    storageClass: "" # Use empty string for static PVs
    size: 500Gi
    nfs:
      server: 10.2.1.147
      path: /volume1/Library

# Retention policy
retention:
  keepLast: 3
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6

# Backblaze B2 configuration
b2:
  existingSecret: restic-b2-secrets

  #accessKeyId: "xyz"
  #secretAccessKey: "xyz"
  #repository: "xyz"
  #resticPassword: "xyz"

# Slack/webhook notifications (optional)
notifications:
  enabled: false
  webhookUrl: ""

# Job settings
jobSettings:
  backoffLimit: 3
  restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Infisical Secrets Operator integration.
# When enabled, the operator syncs secrets from the self-hosted Infisical
# platform into the managed K8s Secret(s), replacing the SealedSecret(s) in
# sealed-secrets/. Requires charts/infisical-secrets-operator + machine identity.
# Kept disabled until per-chart cutover (Phase 3). See
# docs/runbooks/INFISICAL_MIGRATION.md.
infisical:
  enabled: true
  # In-cluster Service URL — public hostname only resolves via pihole DNS,
  # which CoreDNS can't reach. Keeps operator traffic in-cluster.
  hostAPI: http://infisical-infisical-standalone-infisical.default.svc.cluster.local:8080/api
  resyncInterval: 60s
  instantUpdates: false
  projectSlug: homelab-nkcl
  envSlug: prod
  secretsPath: /backup/restic
  credentialsRef:
    secretName: infisical-machine-identity
    secretNamespace: infisical-secrets-operator
