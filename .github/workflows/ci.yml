name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Scan for committed secrets
        run: infisical scan --config .infisical-scan.toml --verbose --redact

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
        with:
          version: v3.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Helm repositories
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
          helm repo add otwld https://helm.otwld.com/
          helm repo add infisical-helm-charts https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
          helm repo update

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.29.0
          kubectl_version: v1.33.4

  deploy:
    needs: [scan, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Add Helm repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metallb https://metallb.github.io/metallb
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
          helm repo add otwld https://helm.otwld.com/
          helm repo add infisical-helm-charts https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
          helm repo update

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Detect changed charts
        id: list-changed
        run: |
          # Find charts that changed in the last commit
          changed_files=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$changed_files"

          # Extract unique chart directories from changed files
          changed_charts=$(echo "$changed_files" | grep '^charts/' | cut -d/ -f1,2 | sort -u)

          if [[ -n "$changed_charts" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "charts<<EOF" >> "$GITHUB_OUTPUT"
            echo "$changed_charts" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Detected changed charts:"
            echo "$changed_charts"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No chart changes detected"
          fi

      - name: Set up kubeconfig
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connectivity
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy changed charts
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          # Critical infrastructure charts requiring strict health checks
          # These will use --wait --atomic to ensure they're healthy before proceeding
          CRITICAL_CHARTS=(
            "cert-manager"
            "nginx-ingress"
            "metallb"
            "sealed-secrets"
          )

          # Application charts requiring --wait --atomic to auto-rollback on failure
          ATOMIC_CHARTS=(
            "recipe-rip"
          )

          # Charts to exclude from auto-deployment:
          EXCLUDED_CHARTS=(
          )

          # Read the changed charts from the output
          changed_charts=$(cat <<'EOF'
          ${{ steps.list-changed.outputs.charts }}
          EOF
          )

          echo "🚀 Deploying changed charts..."

          for chart in $changed_charts; do
            chart_name=$(basename "$chart")

            # Check if chart is excluded
            if [[ " ${EXCLUDED_CHARTS[@]} " =~ " ${chart_name} " ]]; then
              echo "⏭️  Skipping $chart_name (excluded from auto-deployment)"
              continue
            fi

            # Determine if this is a critical infrastructure chart
            if [[ " ${CRITICAL_CHARTS[@]} " =~ " ${chart_name} " ]]; then
              echo "🔧 Processing CRITICAL chart: $chart_name"
              WAIT_FLAGS="--wait --timeout 5m --atomic"
            elif [[ " ${ATOMIC_CHARTS[@]} " =~ " ${chart_name} " ]]; then
              echo "📦 Processing APPLICATION chart (atomic): $chart_name"
              WAIT_FLAGS="--wait --timeout 2m --atomic"
            else
              echo "📦 Processing APPLICATION chart: $chart_name"
              WAIT_FLAGS="--timeout 2m"
            fi

            # Build dependencies from Chart.lock if it exists, otherwise update
            if [ -f "$chart/Chart.lock" ]; then
              echo "  ⬇️  Building dependencies from Chart.lock..."
              helm dependency build "$chart"
            elif grep -q "dependencies:" "$chart/Chart.yaml" 2>/dev/null; then
              echo "  ⬇️  Updating dependencies (no Chart.lock found)..."
              helm dependency update "$chart"
            fi

            # Determine namespace from chart values or use chart name
            namespace=$(yq eval '.namespace // "'$chart_name'"' "$chart/values.yaml" 2>/dev/null || echo "$chart_name")

            # Create namespace if it doesn't exist
            kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -

            # Deploy the chart
            echo "  🚢 Deploying to namespace: $namespace"
            GLOBAL_VALUES=""
            if [ -f "values/network.yaml" ]; then
              GLOBAL_VALUES="-f values/network.yaml"
            fi
            LOCAL_VALUES=""
            if [ -f "$chart/values.local.yaml" ]; then
              LOCAL_VALUES="-f $chart/values.local.yaml"
            fi
            if helm upgrade --install "$chart_name" "$chart" \
              --namespace "$namespace" \
              --create-namespace \
              --reset-values \
              $GLOBAL_VALUES \
              $LOCAL_VALUES \
              $WAIT_FLAGS; then
              echo "  ✅ Successfully deployed $chart_name"
            else
              echo "  ⚠️  Deployment completed with issues for $chart_name"
              helm status "$chart_name" -n "$namespace" || true
            fi

            # Force rollout restart for charts with ConfigMaps that don't auto-reload
            # This ensures pods pick up ConfigMap changes immediately
            RESTART_CHARTS=("alloy")
            if [[ " ${RESTART_CHARTS[@]} " =~ " ${chart_name} " ]]; then
              echo "  🔄 Restarting pods to pick up ConfigMap changes..."
              kubectl rollout restart daemonset/"$chart_name" -n "$namespace" 2>/dev/null || \
              kubectl rollout restart deployment/"$chart_name" -n "$namespace" 2>/dev/null || \
              kubectl rollout restart statefulset/"$chart_name" -n "$namespace" 2>/dev/null || \
              echo "  ⚠️  No daemonset/deployment/statefulset found to restart"
              kubectl rollout status daemonset/"$chart_name" -n "$namespace" --timeout=3m 2>/dev/null || \
              kubectl rollout status deployment/"$chart_name" -n "$namespace" --timeout=3m 2>/dev/null || \
              kubectl rollout status statefulset/"$chart_name" -n "$namespace" --timeout=3m 2>/dev/null || true
            fi
          done

          echo "🎉 All charts processed!"

      - name: Deployment summary
        if: always() && steps.list-changed.outputs.changed == 'true'
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changed charts:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.list-changed.outputs.charts }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Health check report
          echo "### Pod Health Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chart | Namespace | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          changed_charts=$(cat <<'EOF'
          ${{ steps.list-changed.outputs.charts }}
          EOF
          )

          for chart in $changed_charts; do
            chart_name=$(basename "$chart")
            namespace=$(yq eval '.namespace // "'$chart_name'"' "$chart/values.yaml" 2>/dev/null || echo "$chart_name")

            # Get pod status
            pod_info=$(kubectl get pods -n "$namespace" -l "app.kubernetes.io/instance=$chart_name" \
              -o jsonpath='{range .items[*]}{.status.phase}{","}{.status.conditions[?(@.type=="Ready")].status}{","}{.status.conditions[?(@.reason=="Unschedulable")].message}{"\n"}{end}' \
              2>/dev/null || echo "NotFound")

            if [[ -z "$pod_info" ]] || [[ "$pod_info" == "NotFound" ]]; then
              echo "| $chart_name | $namespace | ⚠️ No Pods | Chart deployed but no pods found |" >> $GITHUB_STEP_SUMMARY
            elif echo "$pod_info" | grep -q "Running.*True"; then
              running_count=$(echo "$pod_info" | grep -c "Running.*True" || echo "0")
              echo "| $chart_name | $namespace | ✅ Running | $running_count pod(s) healthy |" >> $GITHUB_STEP_SUMMARY
            elif echo "$pod_info" | grep -q "Pending"; then
              reason=$(echo "$pod_info" | grep -o "node affinity\|Insufficient.*\|taints" | head -1 || echo "scheduling")
              echo "| $chart_name | $namespace | ⏸️ Pending | Waiting for $reason |" >> $GITHUB_STEP_SUMMARY
            else
              status=$(echo "$pod_info" | cut -d',' -f1 | head -1)
              echo "| $chart_name | $namespace | ❌ $status | Check pod logs |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
